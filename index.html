<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FD Calculator pjt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>FD Calculator</h1>
        <div class="form-group">
            <label for="principle">principle amount</label>
            <input type="number" id="principle" placeholder="enter principle amount">
        </div>
        <div class="form-group">
            <label for="interestRate">interest rate</label>
            <input type="number" id="interestRate" placeholder="enter the interest rate">
        </div>
        <div class="form-group">
            <label for="tenure">tenure (in years)</label>
            <input type="number" id="tenure" placeholder="enter the tenure in years">
        </div>
        <button id="calculatorBtn" class="calculator-btn"> Calculate </button>
        <p id="result" class="result">Maturity Amount</p>

    </div>

 
<script src="script.js"></script>
</body>
</html>
